# Tavily-backed web search for the DeepSeek Harness web seam (ctx.web).
#
# This bundle contributes three rows: it mounts this package's search provider,
# it points the web seam's search at it, and it switches off the DeepSeek search
# provider the base bundle ships. The result is one search provider and one
# Plugins card, not two.
#
# `name:` on the inserted row must match this package's package.json `name` —
# renaming the package means updating that line too, or the row will not
# resolve.
#
# Disabling `web-search-deepseek` is what makes this package the deployment's
# search provider instead of a second one. That row is inserted by `dsh-base`,
# so leaving it enabled puts two providers in the seam's registry and two cards
# in Settings → Plugins → Plugin configuration. A disabled row never loads, so
# it registers neither. A patch that matches no row only warns and is skipped,
# so this line is harmless on a profile that never had the row.
#
# A patch replaces the targeted row's WHOLE `config`, so the base `web` row is
# restated in full: `fetchProvider` keeps the http provider the base already
# selected. `searchProvider` is deliberately NOT set: the seam resolves its
# provider on every call, so leaving it unpinned is what lets the card's
# `provider` setting switch backends without a restart. This package's provider
# is usable only while the row below is off, and the shipped provider is usable
# only while it is on, so the seam always sees exactly one usable provider.
#
# A user's own cordis.patch.yml is applied after every bundle layer, so it can
# still override any of these rows — restate the whole config to change one, and
# set `disabled: false` on `web-search-deepseek` to run both providers.

- insert:
    - id: web-search-tavily
      name: '@0x427567/dsh-tavily'
      config:
        apiKeyEnv: TAVILY_API_KEY

- id: web-search-deepseek
  disabled: true

- id: web
  config:
    fetchProvider: http
